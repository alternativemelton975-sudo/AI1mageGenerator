<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Image Generator</title>
    <style>
      body { font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; padding: 2rem; }
      form { max-width: 480px; display: grid; gap: 0.75rem; }
      input, button { padding: 0.8rem; border-radius: 8px; border: 1px solid #334155; }
      button { background: #2563eb; color: white; cursor: pointer; }
    </style>
  </head>
  <body>
    <h1>AI Image Generator</h1>
    <form action="/generate" method="post">
      <label for="prompt">Describe the image</label>
      <input id="prompt" name="prompt" placeholder="A fantasy landscape, trending on artstation" />
      <button type="submit">Generate</button>
    </form>
  </body>
</html>
