<!DOCTYPE html>
<html>
<head>
    <title>AI1mageGenerator</title>
</head>
<body>

    <h1>{{ prompt }}</h1>

    {% if error %}
        <h3>Error</h3>
        <p>{{ error }}</p>
    {% endif %}

    {% if image_url %}
        <img src="{{ image_url }}" alt="Generated Image" width="700">
    {% endif %}

    {% if not image_url and not error %}
        <p>No image was returned.</p>
    {% endif %}

    <br><br>

    <a href="/">Generate Another</a>

</body>
</html>
