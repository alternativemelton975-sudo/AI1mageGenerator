<!DOCTYPE html>
<html>
<head>
    <title>{{ prompt }}</title>

    <style>
        body{
            text-align:center;
            font-family:Arial,sans-serif;
        }

        .gallery{
            display:flex;
            flex-wrap:wrap;
            justify-content:center;
            gap:20px;
        }

        img{
            width:300px;
            border-radius:10px;
        }
    </style>

</head>
<body>

<h1>Results for "{{ prompt }}"</h1>

<div class="gallery">
    {% for image in image_urls %}
        <img src="{{ image }}" alt="{{ prompt }}">
    {% endfor %}
</div>

<br>

<a href="/">Search Again</a>

</body>
</html>
